services:
  - type: web
    name: tn-transmit-smart-crowd-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 2 --timeout 600 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: AUTHORITY_CALLBACK_TOKEN
        sync: false
      - key: DRIVER_STATUS_CALLBACK_URL
        value: https://tn-transmit-smart-crowd-ai.onrender.com/api/authority/alert-status
